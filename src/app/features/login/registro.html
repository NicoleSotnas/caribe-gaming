<div class="tela-login">
  <form [formGroup]="registroForm" (ngSubmit)="onSubmit()" class="card-login">
    <h1>Criar conta</h1>

    <div class="campo">
      <label for="nome">Nome de usuário</label>
      <input
        id="nome"
        type="text"
        formControlName="nome"
        placeholder="Como você quer ser chamado?"
      />

      <span
        class="erro"
        *ngIf="registroForm.get('nome')?.touched && registroForm.get('nome')?.invalid"
      >
        O nome precisa ter no mínimo 3 caracteres
      </span>
    </div>

    <div class="campo">
      <label for="email">Email</label>
      <input id="email" type="email" formControlName="email" placeholder="seu@email.com" />

      <span
        class="erro"
        *ngIf="registroForm.get('email')?.touched && registroForm.get('email')?.invalid"
      >
        Digite um email válido
      </span>
    </div>

    <div class="campo">
      <label for="senha">Senha</label>
      <input id="senha" type="password" formControlName="senha" placeholder="Mínimo 6 caracteres" />

      <span
        class="erro"
        *ngIf="registroForm.get('senha')?.touched && registroForm.get('senha')?.invalid"
      >
        A senha precisa ter no mínimo 6 caracteres
      </span>
    </div>

    <div class="campo">
      <label for="confirmarSenha">Confirmar senha</label>
      <input
        id="confirmarSenha"
        type="password"
        formControlName="confirmarSenha"
        placeholder="Repita a senha"
      />

      <span
        class="erro"
        *ngIf="
          registroForm.get('confirmarSenha')?.touched && registroForm.errors?.['senhasDiferentes']
        "
      >
        As senhas não coincidem
      </span>
    </div>

    <p class="erro-geral" *ngIf="mensagemErro">{{ mensagemErro }}</p>

    <button type="submit" [disabled]="carregando">
      {{ carregando ? 'Criando conta...' : 'Criar conta' }}
    </button>

    <p class="link-login">Já tem uma conta? <a routerLink="/login">Entrar</a></p>

    <a routerLink="/" class="link-voltar">← Voltar para a Home</a>
  </form>
</div>

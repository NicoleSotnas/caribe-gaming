<div class="tela-login">
  <form
    *ngIf="!modoRecuperacao"
    [formGroup]="loginForm"
    (ngSubmit)="onSubmit()"
    class="card-login"
  >
    <h1>Entrar</h1>

    <div class="campo">
      <label for="email">Email</label>
      <input id="email" type="email" formControlName="email" placeholder="seu@email.com" />

      <span class="erro" *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid">
        Digite um email válido
      </span>
    </div>

    <div class="campo">
      <label for="senha">Senha</label>
      <input id="senha" type="password" formControlName="senha" placeholder="••••••••" />

      <span class="erro" *ngIf="loginForm.get('senha')?.touched && loginForm.get('senha')?.invalid">
        A senha deve ter no mínimo 6 caracteres
      </span>
    </div>

    <button type="button" class="link-esqueci" (click)="abrirRecuperacao()">
      Esqueceu a senha?
    </button>

    <p class="erro-geral" *ngIf="mensagemErro">{{ mensagemErro }}</p>

    <button type="submit" [disabled]="carregando">
      {{ carregando ? 'Entrando...' : 'Entrar' }}
    </button>

    <div class="divisor">ou</div>

    <button type="button" class="btn-google" (click)="onGoogleLogin()" [disabled]="carregando">
      <svg width="18" height="18" viewBox="0 0 48 48">
        <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.9 32.6 29.4 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 3l5.7-5.7C34.1 6 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.2-.1-2.4-.4-3.5z"/>
        <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3 0 5.8 1.1 7.9 3l5.7-5.7C34.1 6 29.3 4 24 4c-7.5 0-14 4.1-17.7 10.7z"/>
        <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.5 26.7 36 24 36c-5.3 0-9.8-3.4-11.4-8.1l-6.5 5C9.9 39.8 16.4 44 24 44z"/>
        <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4.1 5.6l6.2 5.2C39.9 36.7 44 31 44 24c0-1.2-.1-2.4-.4-3.5z"/>
      </svg>
      Entrar com o Google
    </button>

    <p class="link-registro">Não tem uma conta? <a routerLink="/registro">Criar conta</a></p>

    <a routerLink="/" class="link-voltar">← Voltar para a Home</a>
  </form>

  <form
    *ngIf="modoRecuperacao"
    [formGroup]="recuperarForm"
    (ngSubmit)="onRecuperarSenha()"
    class="card-login"
  >
    <h1>Recuperar senha</h1>
    <p class="subtitulo">Informe seu email e enviaremos um link para redefinir sua senha.</p>

    <div class="campo">
      <label for="emailRecuperacao">Email</label>
      <input
        id="emailRecuperacao"
        type="email"
        formControlName="email"
        placeholder="seu@email.com"
      />

      <span
        class="erro"
        *ngIf="recuperarForm.get('email')?.touched && recuperarForm.get('email')?.invalid"
      >
        Digite um email válido
      </span>
    </div>

    <p class="erro-geral" *ngIf="mensagemErro">{{ mensagemErro }}</p>
    <p class="sucesso" *ngIf="mensagemSucesso">{{ mensagemSucesso }}</p>

    <button type="submit" [disabled]="carregando">
      {{ carregando ? 'Enviando...' : 'Enviar link de recuperação' }}
    </button>

    <button type="button" class="link-voltar-login" (click)="voltarParaLogin()">
      ← Voltar para o login
    </button>
  </form>
</div>

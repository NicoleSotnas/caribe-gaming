<link rel="stylesheet" href="home.css" />
<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
/>
<body>
  <header>
    <div class="logo">
      <img src="/img/logo.png" width="240px" height="210px" >
    </div>
    <nav>
      <button class="botao ativo"><i class="fa-solid fa-house"></i>HOME</button>
      <button class="botao"><i class="fa-solid fa-gamepad"></i>PRODUTOS</button>
      <button class="botao"><i class="fa-solid fa-cart-shopping"></i>CARRINHO</button>

      <ng-container *ngIf="usuarioAtual$ | async as usuario; else botaoLogin">
        <span class="usuario-logado">{{ usuario.email }}</span>
        <button class="botao" (click)="sair()">SAIR</button>
      </ng-container>

      <ng-template #botaoLogin>
        <button class="botao" routerLink="/login"><i class="fa-solid fa-anchor"></i>LOGIN</button>
      </ng-template>
    </nav>
  </header>

  <main>
    <div class="banner"></div>
  </main>

  <!-- fazer uma linha depois do banner -->
</body>

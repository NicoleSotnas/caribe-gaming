<header class="header-container">
  <div class="logo-brand" routerLink="/" (click)="fecharMenu()">
    <img src="/img/logo.png" alt="Logo Caribe's Gaming" />
    <span class="brand-title">Caribe's Gaming</span>
  </div>

  <button class="hamburger-btn" (click)="toggleMenu()" aria-label="Abrir Menu">
    <i class="fa-solid" [ngClass]="menuAberto ? 'fa-xmark' : 'fa-bars'"></i>
  </button>

  <nav [class.open]="menuAberto">
    <div class="button-row">
      <button
        class="botao"
        routerLink="/"
        routerLinkActive="ativo"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="fecharMenu()"
      >
        <img src="/img/coqueiro.png" alt="Home" class="nav-icon" />
        <span>HOME</span>
      </button>

      <button class="botao" routerLink="/jogos" routerLinkActive="ativo" (click)="fecharMenu()">
        <img src="/img/controle-de-video-game.png" alt="Produtos" class="nav-icon" />
        <span>PRODUTOS</span>
      </button>

      <button
        class="botao"
        routerLink="/carrinho"
        routerLinkActive="ativo"
        #rlaCarrinho="routerLinkActive"
        (click)="fecharMenu()"
      >
        <img
          [src]="
            rlaCarrinho.isActive ? '/img/bau-de-tesouro.png' : '/img/bau-de-tesouro-fechado.png'
          "
          alt="Carrinho"
          class="nav-icon"
        />
        <span>CARRINHO</span>
      </button>

      @if (authFacade.estaLogado()) {
        <div class="conta-container">
          <button class="conta-trigger" (click)="toggleMenuUsuario()">
            <i class="fa-solid fa-circle-user avatar-usuario"></i>
            <i class="fa-solid fa-chevron-down seta" [class.rotacionada]="menuUsuarioAberto"></i>
          </button>

          @if (menuUsuarioAberto) {
            <div class="conta-dropdown">
              <div class="conta-dropdown-header">
                <i class="fa-solid fa-circle-user avatar-usuario-grande"></i>
                <span class="email">{{ authFacade.usuarioAtual()?.email }}</span>
              </div>

              <hr class="dropdown-divisor" />

              @if (authFacade.ehAdmin()) {
                <button
                  class="dropdown-item"
                  routerLink="/admin"
                  (click)="menuUsuarioAberto = false; fecharMenu()"
                >
                  <i class="fa-solid fa-user-shield"></i>
                  Painel Admin
                </button>
              }

              <button class="dropdown-item sair" (click)="sair()">
                <i class="fa-solid fa-right-from-bracket"></i>
                Sair
              </button>
            </div>
          }
        </div>
      } @else {
        <button
          class="botao btn-login"
          routerLink="/login"
          routerLinkActive="ativo"
          (click)="fecharMenu()"
        >
          <img src="/img/ancora-de-navio.png" alt="Login" class="nav-icon" />
          <span>LOGIN</span>
        </button>
      }
    </div>
  </nav>
</header>

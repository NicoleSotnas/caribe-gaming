<header class="header-container">
  <!-- Logo + Nome da Loja -->
  <div class="logo-brand" routerLink="/" (click)="fecharMenu()">
    <img src="/img/logo.png" alt="Logo Caribe's Gaming" />
    <span class="brand-title">Caribe's Gaming</span>
  </div>

  <div class="user-info" *ngIf="authFacade.estaLogado()">
    <span class="email">{{ authFacade.usuarioAtual()?.email }}</span>
    <button pButton variant="text" severity="secondary" class="btn-sair" (click)="sair()">SAIR</button>
  </div>
</header>

<header class="header-container">
  <div class="button-row">
    <button pButton variant="outlined">Home</button>
    <button pButton variant="outlined" severity="secondary">Jogos</button>
    <button pButton variant="outlined" severity="success">Login</button>
    <button pButton variant="outlined" severity="info">Carrinho</button>
  </div>

  <div class="user-info" *ngIf="authFacade.estaLogado()">
    <span class="email">{{ authFacade.usuarioAtual()?.email }}</span>
    <button pButton variant="text" severity="secondary" class="btn-sair" (click)="sair()">SAIR</button>
  </div>
</header>
